name: Periodic estimators

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  periodic:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install locked numerical environment
        run: uv sync --locked --extra metrics --python '${{ matrix.python }}'
      - name: Run required numerical tests (missing NumPy fails)
        run: uv run --no-sync python tests/test_periodic_estimators.py --numerical
      - name: Execute the complete qualification and primary sentinels
        run: uv run --no-sync python tools/qualify_periodic_estimators.py --output periodic-ci.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: periodic-${{ matrix.python }}
          path: periodic-ci.json
          if-no-files-found: error
