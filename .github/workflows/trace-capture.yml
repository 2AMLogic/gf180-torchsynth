name: Trace capture

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stdlib:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Compile capture surfaces
        run: python -m compileall -q src/torchsynth_voice/trace_capture.py tests/test_trace_capture.py tools/qualify_trace_capture.py env/release-era/capture_traces.py
      - name: Test capture contract on the fake graph
        run: python -m unittest discover -s tests -p test_trace_capture.py -v
      - name: Check preregistered capture inputs and negative controls
        run: python tools/qualify_trace_capture.py --check-inputs
      - name: Validate committed publication when present
        run: |
          if [ -f sim/reference/trace-capture.json ]; then
            python tools/qualify_trace_capture.py --check-publication
          else
            echo "publication: ABSENT — requires the host-gated qualified"
            echo "release-era run (tools/qualify_trace_capture.py); absence"
            echo "is not treated as a pass."
          fi
