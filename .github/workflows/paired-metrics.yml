name: Paired metrics

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  metrics:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8" # manual pin; Dependabot bumps the action SHA, not this input
      - name: Install only the metrics extra
        run: uv sync --locked --extra metrics --python '${{ matrix.python }}'
      - name: Verify the environment excludes Torch
        run: uv run --no-sync python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"
      - name: Run analytic, FFT, scorecard, and full-clip smoke tests
        run: uv run --no-sync python tests/test_paired_metrics.py --spectral -v
