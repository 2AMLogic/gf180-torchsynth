name: Paired metrics

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  metrics:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install only the metrics extra
        run: uv sync --locked --extra metrics --python '${{ matrix.python }}'
      - name: Verify the environment excludes Torch
        run: uv run --no-sync python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"
      - name: Run analytic, FFT, scorecard, and full-clip smoke tests
        run: uv run --no-sync python tests/test_paired_metrics.py --spectral -v
