name: Reference repeatability

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sentinel:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run probe integrity tests
        run: python -S -m unittest discover -s env/release-era -q
      - name: Render the pinned CPU sentinel and reject mutations
        run: bash env/release-era/qualify_repeatability.sh sentinel --output out/ci-sentinel
      - name: Retain actual results and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-repeatability
          path: out/
          if-no-files-found: error
