name: Spectral estimators

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualification:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install the locked numerical environment
        run: uv sync --locked --extra metrics --python '${{ matrix.python }}'
      - name: Execute numerical and contract tests
        run: uv run --no-sync python tests/test_spectral_estimators.py --numerical -v
      - name: Regenerate actual analytic grids and sentinels
        run: uv run --no-sync python tools/qualify_spectral_estimators.py --output '${{ runner.temp }}/spectral-qualification.json'
      - name: Verify committed diagnostic bytes and rows
        run: uv run --no-sync python tools/qualify_spectral_estimators.py --verify sim/qualification/spectral-noise-mix-v1.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: spectral-qualification-python-${{ matrix.python }}
          path: ${{ runner.temp }}/spectral-qualification.json
