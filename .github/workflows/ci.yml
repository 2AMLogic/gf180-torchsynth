name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    # GitHub-hosted (free on a public repo) since the 2026-09-30 Blacksmith
    # outage and the operator's move of every public repo off Blacksmith (D5).
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile source
        run: python -m compileall -q src tests tools
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Check manifests
        run: python tools/check_contract.py

