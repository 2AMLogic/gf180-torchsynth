name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    # GitHub-hosted (free on a public repo) since the 2026-09-30 Blacksmith
    # outage and the operator's move of every public repo off Blacksmith
    # (2am `docs/ci.md` §"Blacksmith: decided 2026-09-28, retire").
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow depth-1 fetch.
          # tests/test_committed_oneshot_evidence.py asserts that every
          # committed issue-#79 evidence record cites a commit reachable on
          # the default branch -- a record produced on a pull-request branch
          # passes every other check while citing a SHA that, because this
          # repository squash-merges, never lands. That is an ancestry
          # question, and a shallow clone cannot answer it: the check reports
          # "cannot run" and FAILS rather than passing vacuously, so this
          # depth is what lets it be a check at all. The pack is ~27 MiB.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile source
        run: python -m compileall -q src tests tools
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Check manifests
        run: python tools/check_contract.py

