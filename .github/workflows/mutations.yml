name: Mutation framework

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  stdlib:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile mutation surfaces
        run: python -m compileall -q src/torchsynth_voice/mutations.py src/torchsynth_voice/mutation_runtime.py tests/test_mutations.py tools/qualify_mutations.py tools/qualify_mutations_matrix.py tests/test_mutations_matrix.py
      - name: Test fault-injection seam contract on the apparatus harness
        run: python -m unittest discover -s tests -p test_mutations.py -v
      - name: Test the committed bidirectional matrix publication structure
        run: python -m unittest discover -s tests -p test_mutations_matrix.py -v
      - name: Qualify controls and fault matrix, then check the committed publication
        run: |
          python tools/qualify_mutations.py
          python tools/qualify_mutations.py --check
      - name: Check the committed actual-Voice runtime publication
        run: python tools/qualify_mutations_runtime.py --check-publication

  timing-numerical:
    # The #32 family's periodic rows need NumPy. The stdlib contract surface
    # asserts the declared detector unavailability there; this job asserts
    # the full trips with the locked metrics extra and single-threaded BLAS,
    # and revalidates the committed timing publication against a fresh
    # rebuild on the same numerical host (the #34 matrix rerun gate executes
    # this check; drift must surface here first, never only in composition).
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install locked numerical environment
        run: uv sync --locked --extra metrics --python '3.13'
      - name: Require NumPy (a missing dependency must not become a skip)
        run: uv run --no-sync python -c "import numpy"
      - name: Run the timing family tests with NumPy
        run: uv run --no-sync python -m unittest discover -s tests -p test_mutations_timing.py -v
      - name: Check the committed timing publication against a fresh rebuild
        run: uv run --no-sync python tools/qualify_mutations_timing.py --check

  signal-numerical:
    # The #33 family's periodic property rows need NumPy. The stdlib contract
    # surface asserts the declared estimator unavailability there; this job
    # asserts the full trips with the locked metrics extra and single-threaded
    # BLAS, and revalidates the committed signal publication against a fresh
    # rebuild on the same numerical host (the #34 matrix rerun gate executes
    # this check; drift must surface here first, never only in composition).
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install locked numerical environment
        run: uv sync --locked --extra metrics --python '3.13'
      - name: Require NumPy (a missing dependency must not become a skip)
        run: uv run --no-sync python -c "import numpy"
      - name: Run the signal family tests with NumPy
        run: uv run --no-sync python -m unittest discover -s tests -p test_mutations_signal.py -v
      - name: Check the committed signal publication against a fresh rebuild
        run: uv run --no-sync python tools/qualify_mutations_signal.py --check

  matrix-numerical:
    # The #34 matrix reruns the landed family publications, and four family
    # rows (two timing periodic, two signal periodic property) need NumPy for
    # their full trips; a missing dependency fails the reruns, never a skip.
    # This job executes the bidirectional matrix composition and checks the
    # committed publication with the locked metrics extra and single-threaded
    # BLAS, mirroring the landed -numerical jobs.
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install locked numerical environment
        run: uv sync --locked --extra metrics --python '3.13'
      - name: Require NumPy (a missing dependency must not become a skip)
        run: uv run --no-sync python -c "import numpy"
      - name: Compose the bidirectional matrix, then check the committed publication
        run: |
          uv run --no-sync python tools/qualify_mutations_matrix.py
          uv run --no-sync python tools/qualify_mutations_matrix.py --check
